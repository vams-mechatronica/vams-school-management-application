{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <h2 class="my-4">Dashboard Overview</h2>
    
    <div class="row">
        <!-- Cards -->
        {% for item in dashboard_cards %}
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-{{ item.bg }} h-100">
                <div class="card-header">{{ item.title }}</div>
                <div class="card-body">
                    <h5 class="card-title text-center" id="{{ item.id }}">--</h5>
                </div>
            </div>
        </div>
        {% endfor %}

    </div>

    <!-- Graphs -->
    <div class="row">
        <!-- Student Attendance Bar Graph -->
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-header">Student Attendance (This Week)</div>
                <div class="card-body">
                    <canvas id="student-attendance-graph"></canvas>
                </div>
            </div>
        </div>

        <!-- Staff Attendance Bar Graph -->
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-header">Staff Attendance (This Week)</div>
                <div class="card-body">
                    <canvas id="staff-attendance-graph"></canvas>
                </div>
            </div>
        </div>

        <!-- Fees Pie Chart -->
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-header">Fees Recovery (This Month)</div>
                <div class="card-body">
                    <canvas id="fees-pie-chart" style="width:200px; height:200px;"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% block morejs %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/v1/dashboard-data/')
        .then(response => response.json())
        .then(data => {
            // Card data
            document.getElementById('total-students').innerText = data.total_students;
            document.getElementById('student-attendance').innerHTML = `Present: <b>${data.present_students}</b> | Absent: <b>${data.absent_students}</b>`;
            document.getElementById('total-staff').innerText = data.total_staff;
            document.getElementById('staff-attendance').innerHTML = `Present: <b>${data.present_staff}</b> | Absent: <b>${data.absent_staff}</b>`;
            document.getElementById('fees-balance').innerText = `₹${data.fees_balance}`;
            document.getElementById('fees-received').innerText = `₹${data.fees_received}`;

            // Student Attendance Graph
            const studentCtx = document.getElementById('student-attendance-graph').getContext('2d');
            new Chart(studentCtx, {
                type: 'bar',
                data: {
                    labels: data.attendance_graph.labels,
                    datasets: [
                        {
                            label: 'Present',
                            data: data.attendance_graph.present,
                            backgroundColor: '#28a745',
                            borderRadius: 6,
                        },
                        {
                            label: 'Absent',
                            data: data.attendance_graph.absent,
                            backgroundColor: '#dc3545',
                            borderRadius: 6,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });

            // Staff Attendance Graph
            const staffCtx = document.getElementById('staff-attendance-graph').getContext('2d');
            new Chart(staffCtx, {
                type: 'bar',
                data: {
                    labels: data.staff_attendance_graph.labels,
                    datasets: [
                        {
                            label: 'Present',
                            data: data.staff_attendance_graph.present,
                            backgroundColor: '#28a745',
                            borderRadius: 6,
                        },
                        {
                            label: 'Absent',
                            data: data.staff_attendance_graph.absent,
                            backgroundColor: '#dc3545',
                            borderRadius: 6,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });

            // Fees Pie Chart
            const pieCtx = document.getElementById('fees-pie-chart').getContext('2d');
            new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: ['Received', 'Balance'],
                    datasets: [{
                        data: [data.fees_received, data.fees_balance],
                        backgroundColor: ['#28a745', '#dc3545'],
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        });
});
</script>
{% endblock morejs %}
